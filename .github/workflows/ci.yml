name: SponsorAid CI Pipeline

on:
  push:
    branches: ["main", "feature"]
  pull_request:
    branches: ["main"]

# GHCR'a paket (Image) yazabilmek için Runner'a yetki veriyoruz
permissions:
  contents: read
  packages: write

jobs:
  # =========================================================================
  # JOB 1: BUILD AND UNIT TESTS (CI)
  # =========================================================================
  build-and-test:
    name: Build & Test (.NET 10)
    runs-on: ubuntu-latest # Linux Runner given by GitHub

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: '**/*.csproj'
        
      - name: Restore Dependencies
        run: dotnet restore src/SponsorAid.slnx

      - name: Build Solution
        run: dotnet build src/SponsorAid.slnx -c Release --no-restore

      - name: Run Unit Tests
        run: dotnet test src/SponsorAid.slnx -c Release --no-build --verbosity normal --filter "Category!=Integration"
    
  # =========================================================================
  # JOB 2: DOCKER IMAGE BUILD AND UPLOAD TO THE REGISTRY (ARTIFACT)
  # =========================================================================
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: build-and-test
    # Build an image only when a push is made to the ‘main’ branch (don't build images unnecessarily for Pull Requests)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase Repo Name
        run: echo "REPO_LOWER=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Build and Push API Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./src/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LOWER }}/api:latest
            ghcr.io/${{ env.REPO_LOWER }}/api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build and Push Worker Image
        uses: docker/build-push-action@v6
        with:
          context: ./worker
          file: ./worker/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LOWER }}/worker:latest
            ghcr.io/${{ env.REPO_LOWER }}/worker:${{ github.sha }}
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker

  # =========================================================================
  # JOB 3: CANLI SUNUCUYA OTOMATİK DAĞITIM (CONTINUOUS DEPLOYMENT)
  # =========================================================================
  deploy:
    name: Deploy to Production Server
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. docker-compose.prod.yml dosyasını canlı sunucuya kopyala (SCP)
      - name: Copy docker-compose.prod.yml to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose.prod.yml"
          target: "/opt/sponsoraid"
          
      # 2. Sunucuya SSH ile bağlan, .env üret ve konteynerleri güncelle
      - name: Execute Deployment via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /opt/sponsoraid

            # Repo adını küçük harfe çevir
            REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')

            # 🚀 YÖNTEM A: Dinamik .env dosyasını sıfırdan yaz
            cat <<EOF > .env
            GITHUB_REPOSITORY_LOWER=${REPO_LOWER}
            DB_NAME=${{ secrets.DB_NAME }}
            DB_USER=${{ secrets.DB_USER }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            RABBITMQ_USER=${{ secrets.RABBITMQ_USER }}
            RABBITMQ_PASSWORD=${{ secrets.RABBITMQ_PASSWORD }}
            TELEGRAM_TOKEN=${{ secrets.TELEGRAM_TOKEN }}
            TELEGRAM_ADMIN_CHAT_ID=${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
            DISPATCH_EMAIL_RECIPIENT=${{ secrets.DISPATCH_EMAIL_RECIPIENT }}
            SMTP_HOST=${{ secrets.SMTP_HOST }}
            SMTP_PORT=${{ secrets.SMTP_PORT }}
            SMTP_USER=${{ secrets.SMTP_USER }}
            SMTP_PASS=${{ secrets.SMTP_PASS }}
            SMTP_FROM=${{ secrets.SMTP_FROM }}
            AZURE_VISION_ENDPOINT=${{ secrets.AZURE_VISION_ENDPOINT }}
            AZURE_VISION_KEY=${{ secrets.AZURE_VISION_KEY }}
            EOF

            # Dosya izinlerini kilitle (Sadece dosya sahibi okuyup yazabilsin)
            chmod 600 .env

            # GHCR'a giriş yap (Private repo ise imajları çekebilmek için şarttır)
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Yeni imajları indir
            docker compose -f docker-compose.prod.yml pull

            # Konteynerleri yeni imajlarla ayağa kaldır (Zero-downtime'a yakın geçiş)
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            # Diskin dolmasını önlemek için eski (boşa çıkan) imajları temizle
            docker image prune -f
