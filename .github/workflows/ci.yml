# Continuous integration and deployment pipeline for SponsorAid.
# Automates testing, container image building, and server deployment.
name: SponsorAid CI Pipeline

on:
  push:
    branches: ["main", "feature"]
  pull_request:
    branches: ["main"]

# Read access for repository code and write access to publish images to GitHub Packages.
permissions:
  contents: read
  packages: write

jobs:
  # Compiles .NET solution, installs dependencies, and runs all test suites.
  build-and-test:
    name: Build & Test (.NET 10)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Removes unused tools to free around 20 GB disk space on the runner.
      # Keeps .NET and Docker so following build steps have enough storage.
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: false
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: false

      # Configures .NET 10 SDK with package caching to speed up subsequent builds.
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: '**/*.csproj'
        
      - name: Restore Dependencies
        run: dotnet restore src/SponsorAid.slnx

      - name: Build Solution
        run: dotnet build src/SponsorAid.slnx -c Release --no-restore

      - name: Run Tests
        run: dotnet test src/SponsorAid.slnx -c Release --no-build --verbosity normal

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # Installs CPU-only PyTorch wheels to avoid large CUDA runtime dependencies on the runner.
      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r worker/requirements.txt pytest httpx --extra-index-url https://download.pytorch.org/whl/cpu
          
      - name: Run Python Tests (pytest)
        env:
          TRANSFORMERS_VERBOSITY: debug
        run: |
          cd worker
          pytest tests/ -v
    
  # Builds Docker images and pushes them to GitHub Container Registry.
  # Runs only for pushes to the main branch after tests pass.
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GitHub Container Registry requires lowercase image names.
      - name: Lowercase Repo Name
        run: echo "REPO_LOWER=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      # Builds API container image with GitHub Actions layer cache.
      - name: Build and Push API Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./src/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LOWER }}/api:latest
            ghcr.io/${{ env.REPO_LOWER }}/api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      # Builds worker container image with GitHub Actions layer cache.
      - name: Build and Push Worker Image
        uses: docker/build-push-action@v6
        with:
          context: ./worker
          file: ./worker/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LOWER }}/worker:latest
            ghcr.io/${{ env.REPO_LOWER }}/worker:${{ github.sha }}
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker

  # Deploys updated containers to the remote production host over SSH.
  deploy:
    name: Deploy to Production Server
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Copies production compose configuration to target deployment folder.
      - name: Copy docker-compose.prod.yml to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose.prod.yml"
          target: "/opt/sponsoraid"
          
      # Connects over SSH, generates environment file, and updates containers.
      - name: Execute Deployment via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /opt/sponsoraid

            # Lowercase repository name for container registry image paths.
            REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')

            # Writes production environment variables from GitHub repository secrets.
            cat <<EOF > .env
            GITHUB_REPOSITORY_LOWER=${REPO_LOWER}
            DB_NAME=${{ secrets.DB_NAME }}
            DB_USER=${{ secrets.DB_USER }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            RABBITMQ_USER=${{ secrets.RABBITMQ_USER }}
            RABBITMQ_PASSWORD=${{ secrets.RABBITMQ_PASSWORD }}
            TELEGRAM_TOKEN=${{ secrets.TELEGRAM_TOKEN }}
            TELEGRAM_ADMIN_CHAT_ID=${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
            DISPATCH_EMAIL_RECIPIENT=${{ secrets.DISPATCH_EMAIL_RECIPIENT }}
            SMTP_HOST=${{ secrets.SMTP_HOST }}
            SMTP_PORT=${{ secrets.SMTP_PORT }}
            SMTP_USER=${{ secrets.SMTP_USER }}
            SMTP_PASS=${{ secrets.SMTP_PASS }}
            SMTP_FROM=${{ secrets.SMTP_FROM }}
            AZURE_VISION_ENDPOINT=${{ secrets.AZURE_VISION_ENDPOINT }}
            AZURE_VISION_KEY=${{ secrets.AZURE_VISION_KEY }}
            EOF

            # Restricts file read and write permissions to the file owner.
            chmod 600 .env

            # Authenticates host Docker daemon to pull images from private container registry.
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Pulls updated images and recreates running containers.
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            # Removes dangling images to prevent disk space issues on the host.
            docker image prune -f
