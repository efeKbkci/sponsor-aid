# Development Docker Compose configuration for SponsorAid.
# Builds application images locally and exposes debugging ports to the host machine.
services:
  # Relational database for local development.
  db:
    image: postgres:16-alpine
    container_name: sponsoraid_db
    # Credentials are read from the local .env file.
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    # Exposes database port to allow direct access from local tools and migration scripts.
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  # Message broker for asynchronous task communication.
  rabbitmq:
    # Uses management variant in development to enable the browser dashboard.
    image: rabbitmq:3-management-alpine
    container_name: sponsoraid_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    # Port 5672 is AMQP messaging; port 15672 is the web management interface.
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    # Verifies socket connectivity before starting dependent services.
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q check_port_connectivity"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # ASP.NET Core backend API.
  api:
    # Builds locally from source files using the repository root context.
    build:
      context: .
      dockerfile: src/Dockerfile
    container_name: sponsoraid_api
    env_file:
      - .env
    environment:
      # Development mode enables detailed logs and Swagger documentation.
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=db;Database=${DB_NAME};Username=${DB_USER};Password=${DB_PASSWORD};
      - RABBITMQ_HOST=rabbitmq
      - ASPNETCORE_URLS=http://+:5000
      - WORKER_API_URL=http://worker:8000
    # Exposes API port directly to the host for local browser testing.
    ports:
      - "5000:5000"
    volumes:
      # Shared volume for document file access between API and worker.
      - uploads_data:/app/wwwroot/uploads
    # Ensures database and message broker are initialized first.
    depends_on:
      db:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    restart: on-failure

  # Python background worker for document analysis, OCR, and PDF processing.
  worker:
    # Builds locally from the worker subfolder.
    build:
      context: ./worker
      dockerfile: Dockerfile
    container_name: sponsoraid_worker
    environment:
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_USER=${RABBITMQ_USER}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
      - AZURE_VISION_ENDPOINT=${AZURE_VISION_ENDPOINT}
      - AZURE_VISION_KEY=${AZURE_VISION_KEY}
    # Exposes internal worker HTTP port for direct health check inspection.
    ports:
      - "8000:8000"
    volumes:
      # Shared volume to read files uploaded by the API without network transfers.
      - uploads_data:/app/wwwroot/uploads
    # Waits for message broker readiness before starting consumer loops.
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: on-failure

# Named volumes for data persistence during local development.
volumes:
  postgres_data:
  rabbitmq_data:
  uploads_data:
