services:
  # 1. Veritabanı Konteyneri (Durum Yönetimi ve Kayıtlar)
  db:
    image: postgres:16-alpine
    container_name: sponsoraid_db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  # 2. Mesaj Kuyruğu Konteyneri (İletişim Köprüsü)
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: sponsoraid_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"   # API ve Worker'ın haberleştiği port
      - "15672:15672" # Tarayıcıdan izlenebilen RabbitMQ yönetim paneli
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    restart: unless-stopped

  # 3. ASP.NET Backend Konteyneri (Sistemin Beyni)
  api:
    build:
      context: ./src
      dockerfile: Dockerfile.dev
    container_name: sponsoraid_api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=db;Database=${DB_NAME};Username=${DB_USER};Password=${DB_PASSWORD};
      - RabbitMQ__HostName=rabbitmq
      - DOTNET_USE_POLLING_FILE_WATCHER=1
    ports:
      - "5000:5000"
    volumes:
      # Ana kod eşitlemesi
      - ./src:/app
      # Çakışmayı önlemek için bin/obj klasörlerini izole ediyoruz
      - /app/SponsorAid.Api/bin
      - /app/SponsorAid.Api/obj
      - /app/SponsorAid.Application/bin
      - /app/SponsorAid.Application/obj
      - /app/SponsorAid.Domain/bin
      - /app/SponsorAid.Domain/obj
      - /app/SponsorAid.Infrastructure/bin
      - /app/SponsorAid.Infrastructure/obj
      # Her ayağa kalkışta paketlerin (MediatR vs.) silinmemesi için kalıcı önbellek
      - nuget_cache:/root/.nuget/packages
    depends_on:
      - db
      - rabbitmq
    restart: on-failure

  # 4. Mikroservis Konteyneri (Ağır İşçi)
  worker:
    build:
      context: ./worker
      #dockerfile: Dockerfile
    container_name: sponsoraid_worker
    environment:
      - RabbitMQ__HostName=rabbitmq
    depends_on:
      - rabbitmq
    restart: on-failure

# Verilerin sunucu kapandığında kaybolmaması için kalıcı birimler
volumes:
  postgres_data:
  rabbitmq_data:
  nuget_cache: