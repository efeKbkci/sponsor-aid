syntax = "proto3";

// Defines the generated C# namespace to match the integration layer contracts.
option csharp_namespace = "SponsorAid.Integration.Contracts";

// Identifies the classification of uploaded documents.
// Used instead of raw strings to avoid typing errors between C# and Python services.
enum DocumentType {
  DOCUMENT_TYPE_UNKNOWN = 0;
  DOCUMENT_TYPE_POPULATION_REGISTRY = 1;
  DOCUMENT_TYPE_RESIDENCE = 2;
  DOCUMENT_TYPE_IDENTITY_FRONT = 3;
  DOCUMENT_TYPE_IDENTITY_BACK = 4;
  DOCUMENT_TYPE_MERGED_IDENTITY = 5;
  DOCUMENT_TYPE_BANK_ACCOUNT = 6;
}

// Specifies the physical side of an identity card image.
// Allows the OCR worker to apply side-specific field detection models.
enum ImageSide {
  IMAGE_SIDE_UNKNOWN = 0;
  IMAGE_SIDE_FRONT = 1;
  IMAGE_SIDE_BACK = 2;
}

// Discriminator for background commands sent from the API to the worker.
enum CommandType {
  COMMAND_TYPE_UNKNOWN = 0;
  COMMAND_TYPE_PROCESS_IMAGE = 1;
  COMMAND_TYPE_PROCESS_OFFICIAL_DOC = 2;
  COMMAND_TYPE_MERGE_PDF = 3;
  COMMAND_TYPE_EXTRACT_BARCODE = 4;
  COMMAND_TYPE_PROCESS_BANK_ACCOUNT_DOC = 5;
}

// Represents an individual record extracted from a population registry document.
// Date fields are strings in YYYY-MM-DD format to keep date formatting portable across languages.
message Person {
  string id_number = 1;
  string first_name = 2;
  string last_name = 3;
  string birth_date = 4;
  optional string death_date = 5;
  string kinship = 6;
}

// Holds the collection of family members found in a population registry document.
message PopulationRegistryData {
  repeated Person people = 1;
}

// Holds structured residential address information extracted from official documents.
message ResidenceData {
  string id_number = 1;
  string city = 2;
  string district = 3;
  string neighborhood = 4;
  string full_address = 5;
}

// Result envelope returned by the Python worker to the API through RabbitMQ.
// Uses oneof so the same message schema can carry different extraction payloads.
message WorkerResultMessage {
  string registration_key = 1;
  DocumentType document_type = 2;
  bool is_success = 3;
  
  optional string error_message = 4;
  optional string saved_file_path = 5;

  oneof extracted_data {
    PopulationRegistryData population_data = 6;
    ResidenceData residence_data = 7;
    string extracted_tc_number = 8;
    string extracted_barcode = 9;
    string extracted_iban = 10;
  }
}

// Command payload to run OCR and data extraction on a single identity image.
message ProcessImageTask {
  string registration_key = 1;
  string file_path = 2;
  ImageSide image_side = 3;
}

// Command payload to process official documents such as PDF files or document scans.
message ProcessOfficialDocTask {
  string registration_key = 1;
  string file_path = 2;
  DocumentType document_type = 3;
}

// Command payload to merge front and back identity card images into a single PDF.
message MergePdfTask {
  string registration_key = 1;
  string front_file_path = 2;
  string back_file_path = 3;
}

// Command payload to process bank account documents (PDF or image) and extract IBAN details.
message ProcessBankAccountDocTask {
  string registration_key = 1;
  string file_path = 2;
}

// Top-level envelope received by the Python worker from the task queue.
// The command_type indicates which specific task payload is present in the oneof field.
message WorkerTaskEnvelope {
  CommandType command_type = 1;
  
  oneof task_payload {
    ProcessImageTask image_task = 2;
    ProcessOfficialDocTask official_doc_task = 3;
    MergePdfTask merge_task = 4;
    ProcessBankAccountDocTask bank_account_doc_task = 5;
  }
}
